name: fetch-itemgen

on: workflow_dispatch

jobs:
  grab:
    runs-on: ubuntu-latest
    steps:
      - name: download from google drive
        run: |
          curl -L --fail --retry 3 -o itemgen.zip \
            "https://drive.google.com/uc?export=download&id=1AEPcnHw8MTkU-wFIK3Rk1RUxYzS2YenX"
          ls -l itemgen.zip
          file itemgen.zip

      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: itemgen-1.5.1
          path: itemgen.zip
