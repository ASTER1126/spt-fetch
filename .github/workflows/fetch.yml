name: fetch-itemgen

on: workflow_dispatch

jobs:
  grab:
    runs-on: ubuntu-latest
    steps:
      - name: download from google drive
        run: |
          curl -L --fail --retry 3 -o itemgen.zip \
            "https://drive.google.com/uc?export=download&id=1AEPcnHw8MTkU-wFIK3Rk1RUxYzS2YenX"
          ls -l itemgen.zip
          file itemgen.zip

      - name: upload to litterbox
        run: |
          URL=$(curl -s -F "reqtype=fileupload" -F "time=1h" \
            -F "fileToUpload=@itemgen.zip" \
            https://litterbox.catbox.moe/resources/internals/api.php)
          echo "URL=$URL"
          echo "::notice::下载地址：$URL"
